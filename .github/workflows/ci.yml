name: Clinical Trial ETL Pipeline CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Code Quality & Syntax Check (Flake8)
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 app tests scripts --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 app tests scripts --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

    - name: Initialize Database & Run Test Suite with Pytest
      run: |
        pytest -v --cov=app --cov-report=term --cov-report=xml tests/

    - name: Verify Synthetic Data Generator CLI
      run: |
        python scripts/generate_data.py --output-dir data/sample
        python scripts/run_pipeline.py --input-dir data/sample
